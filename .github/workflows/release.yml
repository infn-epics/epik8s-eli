name: Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install epik8s-tools
        run: |
          python -m pip install --upgrade pip
          pip install epik8s-tools

      - name: Generate Release Notes
        run: |
          epik8s-opigen --yaml deploy/values.yaml --projectdir release-notes-tmp
          cp release-notes-tmp/README.md RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    runs-on: [self-hosted, k8s]
    container:
      image: alpine/ansible:2.18.6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install sshpass
        run: apk add sshpass

      - name: Run Ansible playbook
        run: |
          cd opi/ansible
          ansible-playbook -i hosts.yml configure-consoles.yml
