---
- name: Ensure Python is installed
  apt:
    name: "python{{ python_version }}-venv"
    state: present
  become: yes
  
- name: Install pip if not present
  apt:
    name: python3-pip
    state: present
  become: yes

- name: Ensure Python virtual environment tools are installed
  apt:
    name: "python3-venv"
    state: present
  become: yes

- name: Create Python virtual environments for all opi_repos
  become_user: "{{ item.opi_user }}"
  loop: "{{ opi_repos }}"
  command: "python{{ python_version }} -m venv /home/{{ item.opi_user }}/py_epics_environment"
  args:
    creates: "/home/{{ item.opi_user }}/py_epics_environment/bin/activate"
  when: skip_git_user_config is not defined or not skip_git_user_config

- name: Python requirements
  copy:
    src: requirements.txt
    dest: /home/{{ item.opi_user }}/py_epics_environment/
  become_user: "{{ item.opi_user }}"
  loop: "{{ opi_repos }}"
  when: skip_git_user_config is not defined or not skip_git_user_config

