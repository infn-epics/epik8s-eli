- import_tasks: control_desktop.yml

- import_tasks: py_epics.yml
  when: python_version is defined and python_version != ''


- name: Ensure NFS mount point directory exists
  file:
    path: "{{ item.mountPath }}"
    state: directory
    mode: '0777'
  loop: "{{ nfsMounts }}"
  when: 
    - item.server | default('') | length > 0 and item.path | default('') | length > 0 and item.mountPath | default('') | length > 0
    - nfsMounts is defined and nfsMounts | length > 0
  ignore_errors: true

- name: Unmount NFS shares if mounted
  mount:
    name: "{{ item.mountPath }}"
    state: unmounted
  loop: "{{ nfsMounts }}"
  when: 
    - item.server | default('') | length > 0 and item.path | default('') | length > 0 and item.mountPath | default('') | length > 0
    - nfsMounts is defined and nfsMounts | length > 0
  ignore_errors: true

- name: Mount NFS shares
  mount:
    name: "{{ item.mountPath }}"
    src: "{{ item.server }}:{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opt | default('defaults') }}"
    state: mounted
  loop: "{{ nfsMounts }}"
  when: 
    - item.server | default('') | length > 0 and item.path | default('') | length > 0 and item.mountPath | default('') | length > 0
    - nfsMounts is defined and nfsMounts | length > 0
    - mount_dir | default(true)
  ignore_errors: true
  register: nfs_mount_result

- name: Report NFS mount results
  debug:
    msg: "NFS mount {{ item.item.name }} ({{ item.item.server }}:{{ item.item.path }} -> {{ item.item.mountPath }}): {{ 'SUCCESS' if item.changed else 'FAILED' }}"
  loop: "{{ nfs_mount_result.results }}"
  when: nfs_mount_result is defined

- name: Add entries to /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^{{ item.ip }}\s+{{ item.name }}'
    line: '{{ item.ip }} {{ item.name }}'
    state: present
    create: yes
  loop: "{{ dnsnames }}"
  when:
    - item.ip | default('') | length > 0 and item.name | default('') | length > 0
    - dnsnames is defined and dnsnames | length > 0

- name: Gather service facts to detect the active NTP client
  ansible.builtin.service_facts:
  when: ntpServers is defined and ntpServers | length > 0

- name: Determine chrony config path and service name for this OS family
  set_fact:
    chrony_conf_path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    chrony_service_name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    chrony_configured_hosts_regex: "{{ ntpServers | map('regex_escape') | join('|') }}"
  when: ntpServers is defined and ntpServers | length > 0

# Detect the mechanism by which services are actually installed (service_facts) rather
# than guessing from ansible_os_family/ansible_distribution: unmapped distros (e.g. Linux
# Mint on some Ansible versions) don't reliably report os_family == 'Debian', and consoles
# may already run chrony with systemd-timesyncd present-but-masked (chrony is the intended
# time daemon there, and force-enabling a masked timesyncd unit fails).
- name: Configure NTP servers via chrony (used when chrony is installed)
  when:
    - ntpServers is defined and ntpServers | length > 0
    - (chrony_service_name + '.service') in ansible_facts.services
  notify: Restart chrony
  block:
    - name: Remove default server/pool entries from chrony.conf
      # Excludes lines already matching one of our configured NTP hosts, otherwise this
      # would strip out its own "Add configured NTP servers" lines on every subsequent
      # run (making the task perpetually non-idempotent and restarting chrony each time).
      lineinfile:
        path: "{{ chrony_conf_path }}"
        regexp: '^(server|pool)\s+(?!({{ chrony_configured_hosts_regex }})\b)'
        state: absent

    - name: Add configured NTP servers to chrony.conf
      lineinfile:
        path: "{{ chrony_conf_path }}"
        regexp: '^server\s+{{ item }}\b'
        line: "server {{ item }} iburst"
        insertafter: BOF
        state: present
      loop: "{{ ntpServers }}"

    - name: Remove stale chrony.conf left over from the wrong distro path (e.g. RHEL path on Debian)
      file:
        path: "{{ '/etc/chrony.conf' if chrony_conf_path != '/etc/chrony.conf' else '/etc/chrony/chrony.conf' }}"
        state: absent

- name: Configure NTP servers via systemd-timesyncd (used when chrony is not installed)
  template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - ntpServers is defined and ntpServers | length > 0
    - (chrony_service_name + '.service') not in ansible_facts.services
    - "'systemd-timesyncd.service' in ansible_facts.services"
  notify: Restart systemd-timesyncd

- name: Ensure systemd-timesyncd is enabled and running (when it's the active NTP client)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: yes
    state: started
  when:
    - ntpServers is defined and ntpServers | length > 0
    - (chrony_service_name + '.service') not in ansible_facts.services
    - "'systemd-timesyncd.service' in ansible_facts.services"
